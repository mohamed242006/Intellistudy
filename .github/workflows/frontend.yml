# Frontend CI (docs/F0A_GATE.md GF0A-23, docs/F0B_GATE.md GF0B-30): lockfile install, lint, types, unit and integration
# tests, static security checks, dependency audit, production build; then end-to-end tests against a real backend and
# an OpenAPI drift check. Since F0-B the E2E backend runs its processing worker (uploads reach real terminal states), so
# the E2E job also needs Tesseract (as in backend.yml) and the embedding model, which is cached between runs.
# F1 (docs/F1_GATE.md GF1-26, GF1-27): the E2E backend uses the DETERMINISTIC TEST PROVIDER
# (frontend/tests/e2e/fixtures/stub_llm.py on 127.0.0.1) through the backend's `local` provider slot: no key, no real
# model, no network. playwright.config.ts gives explicit ports; scripts/e2e-frontend.sh builds Next.js only with an
# explicit backend origin (never :8000) and checks the built rewrite; INTELLISTUDY_E2E=1 makes next.config.ts refuse
# a build without one. The embedding model is fetched in its own step, then loaded offline during the run.
# The backend workflow (backend.yml) is unchanged and still runs on every push.
name: frontend

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  checks:
    name: lint, types, unit tests, build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: unit, integration and static security tests (incl. F-M4-03 rendering-safety scan)
        run: npm test
      - name: dependency audit
        run: npm audit --audit-level=high
      - run: npm run build

  e2e:
    name: end-to-end (real backend) and OpenAPI drift
    runs-on: ubuntu-latest
    needs: checks
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      INTELLISTUDY_E2E: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: system packages (document parsing, as in backend.yml)
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: install the locked backend environment
        working-directory: .
        run: >-
          python -m pip install uv &&
          uv pip install --system -r requirements.lock.txt
          --index-url https://pypi.org/simple
          --extra-index-url https://download.pytorch.org/whl/cpu
          --index-strategy unsafe-best-match
      - name: cache the embedding model (BAAI/bge-small-en-v1.5, ai/chunking/config.py)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5-${{ hashFiles('requirements.lock.txt') }}
      - name: fetch the embedding model before the tests (a no-op when cached)
        working-directory: .
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-small-en-v1.5')"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: OpenAPI drift check (generated types must match the backend)
        run: npm run api:schema && git diff --exit-code -- lib/api/openapi.json lib/api/schema.d.ts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
