# Frontend CI (docs/F0A_GATE.md GF0A-23): lockfile install, lint, types, unit and integration tests, static security
# checks, dependency audit, production build; then end-to-end tests against a real backend and an OpenAPI drift check.
# The backend workflow (backend.yml) is unchanged and still runs on every push.
name: frontend

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  checks:
    name: lint, types, unit tests, build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: unit, integration and static security tests (incl. F-M4-03 rendering-safety scan)
        run: npm test
      - name: dependency audit
        run: npm audit --audit-level=high
      - run: npm run build

  e2e:
    name: end-to-end (real backend) and OpenAPI drift
    runs-on: ubuntu-latest
    needs: checks
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the locked backend environment
        working-directory: .
        run: >-
          python -m pip install uv &&
          uv pip install --system -r requirements.lock.txt
          --index-url https://pypi.org/simple
          --extra-index-url https://download.pytorch.org/whl/cpu
          --index-strategy unsafe-best-match
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: OpenAPI drift check (generated types must match the backend)
        run: npm run api:schema && git diff --exit-code -- lib/api/openapi.json lib/api/schema.d.ts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
