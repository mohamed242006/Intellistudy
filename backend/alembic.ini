# Alembic configuration for the IntelliStudy backend.
# The database URL is NOT stored here (contract SEC-01): env.py reads it from -x url=..., then from
# INTELLISTUDY_DATABASE_URL, then falls back to the demo SQLite file.
#
#   alembic -c backend/alembic.ini upgrade head
#   python -m backend.app.db.migrate            (same, programmatic)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
